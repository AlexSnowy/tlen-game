name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://alexsnowy.github.io/tlen-game/
    steps:
      - uses: actions/checkout@v4
      - run: |
          touch public/.nojekyll
          V=${GITHUB_SHA::8}
          sed -i "s/__V__/$V/g" public/index.html public/game.js
          T=$(date +%s)
          sed -i "s/__T__/$T/g" public/game.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: d
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.d.outcome == 'failure'
        run: sleep 25
      - if: steps.d.outcome == 'failure'
        uses: actions/deploy-pages@v4
